<section id="hero" class="hero">

    <!-- ======================================================
         BACKGROUND
    ======================================================= -->

    <div class="hero__background"></div>

    <div class="hero__glow hero__glow--main"></div>
    <div class="hero__glow hero__glow--left"></div>
    <div class="hero__glow hero__glow--right"></div>

    <div class="hero__overlay"></div>


    <!-- ======================================================
         DECORATION — RAMERAS
         Apenas nos cantos
    ======================================================= -->

    <div class="hero__decorations" aria-hidden="true">

        <!-- Rama superior esquerda -->
        <img
            class="hero__branch hero__branch--top-left"
            src="./src/assets/images/rameras/ramera-esquerdo.png"
            alt=""
        >

        <!-- Rama superior direita -->
        <img
            class="hero__branch hero__branch--top-right"
            src="./src/assets/images/rameras/ramera-direita.png"
            alt=""
        >

        <!-- Rama inferior esquerda -->
        <img
            class="hero__branch hero__branch--bottom-left"
            src="./src/assets/images/rameras/ramera-lado.png"
            alt=""
        >

        <!-- Rama inferior direita -->
        <img
            class="hero__branch hero__branch--bottom-right"
            src="./src/assets/images/rameras/ramera-lado.png"
            alt=""
        >

    </div>


    <!-- ======================================================
         DECORATION — FLORES
    ======================================================= -->

    <div class="hero__flowers" aria-hidden="true">

        <!-- Flor branca -->
        <img
            class="hero__flower hero__flower--white"
            src="./src/assets/images/flower/flor-branco.png"
            alt=""
        >

        <!-- Flor rosa -->
        <img
            class="hero__flower hero__flower--pink"
            src="./src/assets/images/flower/flor-rosa.png"
            alt=""
        >

        <!-- Grupo inferior esquerdo -->
        <img
            class="hero__flower hero__flower--group-left"
            src="./src/assets/images/flower/flores-grupo.png"
            alt=""
        >

        <!-- Grupo inferior direito -->
        <img
            class="hero__flower hero__flower--group-right"
            src="./src/assets/images/flower/flores-grupo.png"
            alt=""
        >

    </div>


    <!-- ======================================================
         GOLD PARTICLES
    ======================================================= -->

    <div class="hero__particles" aria-hidden="true">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- ======================================================
         MAIN CONTENT
    ======================================================= -->

    <div class="hero__content">


        <!-- ==================================================
             MONOGRAM
        =================================================== -->

        <div class="hero__monogram">

            <div class="hero__monogram-ring"></div>

            <div class="hero__monogram-ring hero__monogram-ring--inner"></div>

            <img
                class="hero__monogram-image"
                src="./src/assets/images/monograms/monogram4.png"
                alt="Monograma de Suzana y Juan"
            >

        </div>


        <!-- ==================================================
             DIVIDER
        =================================================== -->

        <div class="hero__line" aria-hidden="true">

            <span></span>

            <i>✦</i>

            <span></span>

        </div>


        <!-- ==================================================
             VERSE
        =================================================== -->

        <p class="hero__verse">

            La mujer de Pr. 31:10 y el hombre de Ef. 5:25
            alcanzarán el amor de 1 Co. 13.

        </p>


        <!-- ==================================================
             NAMES
        =================================================== -->

        <h1 class="hero__title">

            <span>Suzana</span>

            <strong>&amp;</strong>

            <span>Juan</span>

        </h1>


        <!-- ==================================================
             DATE
        =================================================== -->

        <p class="hero__date">

            09 Enero 2027

        </p>


        <!-- ==================================================
             COUNTDOWN
        =================================================== -->

        <div
            id="hero-countdown"
            class="hero__countdown"
        >

            <div class="countdown__item">

                <span>000</span>

                <small>Días</small>

            </div>

            <div class="countdown__item">

                <span>00</span>

                <small>Horas</small>

            </div>

            <div class="countdown__item">

                <span>00</span>

                <small>Minutos</small>

            </div>

            <div class="countdown__item">

                <span>00</span>

                <small>Segundos</small>

            </div>

        </div>


        <!-- ==================================================
             DISCOVER
        =================================================== -->

        <div class="hero__discover">

            <button
                class="hero__button"
                type="button"
                aria-label="Descubrir nuestra historia"
            >

                <span class="hero__button-shine"></span>

                <span class="hero__button-text">
                    Descubrir nuestra historia
                </span>

                <span class="hero__button-arrow">
                    ↓
                </span>

            </button>

        </div>

    </div>

</section>
